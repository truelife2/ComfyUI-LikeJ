                        child.material = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(cVal, cVal, cVal),
                            roughness: 0.6,
                            metalness: 0.1,
                            skinning: child.isSkinnedMesh || false
                        });
                    }
                });

                scene.add(currentModel);

                const box = computeExactWorldBoundingBox(currentModel);
                const size = box.getSize(new THREE.Vector3());
                baseJointRadius = Math.max(0.003, size.y * 0.004);

                setupSkeleton(currentModel);

                loadingEl.style.display = 'none';
                isModelLoaded = true;

                if (isRestoring) {
                    updateUIFromConfig();
                    applyModelOffset();
                    if (config.pose && config.pose.length > 0) {
                        applyPoseData(config.pose);
                    } else {
                        resetPose();
                    }
                    if (config.camera) applyCameraData(config.camera);
                    sendPoseToComfyUI();
                } else {
                    fetchDefaultPose(fileName, config.isDefaultModel).then((defaultConfig) => {
                        if (defaultConfig) {
                            if (defaultConfig.rotationOffset) config.rotationOffset = defaultConfig.rotationOffset;
                            if (defaultConfig.ambient !== undefined) config.ambient = defaultConfig.ambient;
                            if (defaultConfig.direct !== undefined) config.direct = defaultConfig.direct;
                            if (defaultConfig.modelColor !== undefined) config.modelColor = defaultConfig.modelColor;
                            if (defaultConfig.jointSize !== undefined) config.jointSize = defaultConfig.jointSize;
                            if (defaultConfig.gizmoSize !== undefined) config.gizmoSize = defaultConfig.gizmoSize;

                            updateUIFromConfig();
                            applyModelOffset();

                            if (defaultConfig.pose && defaultConfig.pose.length > 0) {
                                config.pose = defaultConfig.pose;
                                applyPoseData(defaultConfig.pose);
                            } else {
                                resetPose();
                            }

                            if (defaultConfig.camera) {
                                config.camera = defaultConfig.camera;
                                applyCameraData(defaultConfig.camera);
                            } else {
                                focusFullBody(true);
                            }
                        } else {
                            focusFullBody(true);
                        }

                        notifyConfigChange();
                        sendPoseToComfyUI();
                    });
                }

            }, undefined, (error) => {
                console.error('Failed to load model:', error);
                loadingEl.innerText = i18n[currentLang].msgLoadError;
            });
        }

        window.addEventListener("message", (event) => {
            if (!event.data) return;

            if (event.data.type === "LIKEJ_POSE3D_SET_SIZE") {
                targetWidth = parseInt(event.data.width) || 512;
                targetHeight = parseInt(event.data.height) || 512;
                if (event.data.triggerSend) sendPoseToComfyUI();
            }

            if (event.data.type === "LIKEJ_POSE3D_LOAD_CONFIG") {
                try {
                    let loadedConfig = typeof event.data.configStr === "string"
                        ? JSON.parse(event.data.configStr)
                        : event.data.configStr;

                    if (loadedConfig && Object.keys(loadedConfig).length > 0) {
                        config = { ...config, ...loadedConfig };
                        if (!config.rotationOffset) config.rotationOffset = { x: 0, y: 0, z: 0 };

                        const modelName = config.modelName || 'female_body_base.glb';
                        const isDefault = config.isDefaultModel !== undefined ? config.isDefaultModel : true;

                        const targetUrl = getModelApiUrl(modelName, isDefault);

                        loadModelFromUrl(targetUrl, modelName, true);
                    } else {
                        const defaultName = 'female_body_base.glb';
                        const targetUrl = getModelApiUrl(defaultName, true);
                        loadModelFromUrl(targetUrl, defaultName, false);
                    }
                } catch (e) {
                    console.warn("Failed to parse Node configuration, loading default model", e);
                    const defaultName = 'female_body_base.glb';
                    const targetUrl = getModelApiUrl(defaultName, true);
                    loadModelFromUrl(targetUrl, defaultName, false);
                }
            }
        });

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            renderer.render(scene, camera);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateJointSpheres();
            renderer.render(scene, camera);
        }
        animate();

        controls.addEventListener('end', () => {
            config.camera = getCameraData();
            notifyConfigChange();
            sendPoseToComfyUI();
        });

        // 初始化預設語言
        updateLanguage();

        window.parent.postMessage({ type: "LIKEJ_POSE3D_READY" }, "*");
    </script>
